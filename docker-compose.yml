services:
  db:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devexp}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devexp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - app-network

  identity:
    build:
      context: ./BackEnd/identity-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-devexp}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_PRIVATE_KEY_LOCATION: ${JWT_PRIVATE_KEY_LOCATION:-file:/app/certs/private.key}
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION:-file:/app/certs/public.key}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-identity-service}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_PATH: /app/logs
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
    volumes:
      - ./BackEnd/certs:/app/certs:ro
      - ./logs/identity:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  api:
    build:
      context: ./BackEnd/post-api
      dockerfile: Dockerfile
    ports:
      - "8876:8876"
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-devexp}
      JWT_ISSUER: ${JWT_ISSUER:-identity-service}
      JWT_PUBLIC_KEY_PATH: /app/certs/public.key
      IDENTITY_URL: http://identity:8081
      MQTT_URL: ${MQTT_URL:-mqtt://mqtt:1883}
      MQTT_LIKES_TOPIC: ${MQTT_LIKES_TOPIC:-devexp/posts/likes}
      LOG_COLORS: "true"
      LOG_TO_FILE: "true"
      LOG_DIR: /app/logs
      LOG_FILE: /app/logs/posts-service.log
    volumes:
      - ./BackEnd/certs:/app/certs:ro
      - ./logs/api:/app/logs
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - app-network
  client:
    build:
      context: ./FrontEnd/mi-tumblr-clone
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8876/api
      VITE_IDENTITY_URL: http://localhost:8081/api
      VITE_MQTT_WS_URL: ws://localhost:9001
      VITE_MQTT_LIKES_TOPIC: ${MQTT_LIKES_TOPIC:-devexp/posts/likes}
    depends_on:
      - api
      - identity
      - mqtt
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
