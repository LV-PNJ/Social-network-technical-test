version: '3.8'

services:
  api: # Backend service
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "8876:8876"
    depends_on:
      - db
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  client: # Frontend service
    build:
      context: ./FrontEnd/mi-tumblr-clone # Path
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Map host
    depends_on:
      - api 
    networks:
      - app-network

  db: # Database service (PostgreSQL)
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
